configuration:
  APP_NAME:
    name: "Application Name"
    description: "The name displayed in page titles and navigation."
  APP_URL:
    name: "External Application URL (Optional)"
    description: "The external URL if accessing WeatherNode directly or through an external reverse proxy. Not needed when using the Home Assistant sidebar Ingress."
  APP_KEY:
    name: "Application Encryption Key"
    description: "Required. 32-byte base64 encryption key (format: base64:...). Keep this backed up; if changed, saved encrypted tokens will be invalidated."
  APP_TIMEZONE:
    name: "Timezone"
    description: "Timezone for calculations and timestamps (e.g. UTC, Europe/Berlin, America/New_York)."
  APP_LOCALE:
    name: "Language / Locale"
    description: "Application display language."
  APP_ENV:
    name: "Environment"
    description: "Runtime environment mode (production, local, or testing)."
  APP_DEBUG:
    name: "Debug Mode"
    description: "Enable verbose debugging traces. Leave disabled in normal operation."
  LOG_CHANNEL:
    name: "Log Channel"
    description: "Where application logs are sent. 'stderr' sends them to Home Assistant add-on logs."
  ADMIN_EMAIL:
    name: "Admin Email (Optional)"
    description: "Email address for the administrator account. If omitted, defaults to admin@homeassistant.local with automatic Ingress single sign-on."
  ADMIN_PASSWORD:
    name: "Admin Password (Optional)"
    description: "Password for the administrator account. If omitted, a secure random password is generated; you will be logged in automatically via Home Assistant Ingress."
  TRUSTED_PROXIES:
    name: "Trusted Proxies"
    description: "Proxies to trust for client IP and HTTPS headers (set to '*' or specific CIDR)."
  UPDATER_ENABLED:
    name: "In-App Updater"
    description: "Enable or disable in-app updater button. Keep disabled as container updates are handled automatically via Renovate."

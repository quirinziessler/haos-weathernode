name: "WeatherNode"
slug: "weathernode"
description: "Open source, self-hosted weather dashboard and station aggregator"
url: "https://github.com/quirinziessler/haos-weathernode"
# renovate: datasource=docker depName=ghcr.io/centauri/weathernode
version: "v2026.10.3-ha5"
arch:
  - aarch64
  - amd64
startup: "application"
boot: "auto"
init: false

# Home Assistant Ingress & Sidebar Menu configuration
# Automatically enables sidebar integration and single sign-on as administrator
ingress: true
ingress_port: 80
ingress_entry: "/"
panel_icon: "mdi:weather-partly-cloudy"
panel_title: "WeatherNode"
panel_admin: true

# Optional direct port mapping for weather stations (Ecowitt, Wunderground, etc.)
ports:
  80/tcp: 8080
ports_description:
  80/tcp: "Weather Station Webhook & Direct Access (optional)"

# UI Configuration options exposed to the user in Home Assistant Web UI
options:
  APP_NAME: "WeatherNode"
  APP_URL: "http://homeassistant.local:8080"
  APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
  APP_TIMEZONE: "UTC"
  APP_LOCALE: "en"
  APP_ENV: "production"
  APP_DEBUG: false
  LOG_CHANNEL: "stderr"
  TRUSTED_PROXIES: "*"
  UPDATER_ENABLED: false

# Validation schema for Home Assistant Web UI options
# Note: APP_KEY is required and must begin with 'base64:' followed by valid base64 characters.
# Persistent backend settings (DB_CONNECTION=sqlite, DB_DATABASE=/data/weathernode.sqlite,
# and DOCKER_RUN_SCHEDULER=true) are intentionally omitted from this schema to keep them
# uneditable in the UI and safely hardcoded in run.sh.
schema:
  APP_NAME: "str?"
  APP_URL: "url?"
  APP_KEY: "match(^base64:[A-Za-z0-9+/=]{40,}$)"
  APP_TIMEZONE: "str?"
  APP_LOCALE: "list(en|de|fr|es|it|nl)?"
  APP_ENV: "list(production|local|testing)"
  APP_DEBUG: "bool"
  LOG_CHANNEL: "list(stderr|stack|single|daily)"
  ADMIN_EMAIL: "email?"
  ADMIN_PASSWORD: "password?"
  TRUSTED_PROXIES: "str?"
  UPDATER_ENABLED: "bool?"
